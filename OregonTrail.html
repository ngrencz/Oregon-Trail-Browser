<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oregon Trail (Classic)</title>
    <!-- Load the JS-DOS Emulator -->
    <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
    <style>
        body {
            background-color: #000;
            color: #33ff00;
            font-family: monospace;
            text-align: center;
            margin-top: 50px;
        }
        /* Lock the game screen size */
        canvas {
            width: 640px;
            height: 400px;
            border: 2px solid #33ff00;
        }
    </style>
</head>
<body>

    <h1>The Oregon Trail</h1>
    <p>Click the black screen below to start the emulator.</p>

    <!-- The screen where the game will render -->
    <canvas id="jsdos"></canvas>

    <script>
        // Force GitHub to use the external JS-DOS engine files
        Dos(document.getElementById("jsdos"), { 
            wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js",
            wasmUrl: "https://js-dos.com/6.22/current/wdosbox.wasm"
        }).ready(function (fs, main) {
            
            // Unzip the game file
            fs.extract("oregontrail.zip").then(function () {
                // Run the game (dropping the .EXE just to be safe)
                main(["-c", "OREGON"]);
            });
            
        });
    </script>

</body>
</html>
