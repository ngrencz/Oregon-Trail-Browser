<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oregon Trail</title>
    <!-- Load the JS-DOS Emulator -->
    <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
    <style>
        /* Remove all margins and lock the screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Prevents scrollbars from appearing */
        }
        
        /* Make the game fill the screen and hide the system mouse */
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            object-fit: contain; /* Keeps the original aspect ratio (no fat pixels) */
            cursor: none; /* Fixes the double mouse issue! */
        }
    </style>
</head>
<body>

    <!-- The screen where the game will render -->
    <canvas id="jsdos"></canvas>

    <script>
        // Force GitHub to use the external JS-DOS engine files
        Dos(document.getElementById("jsdos"), { 
            wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js",
            wasmUrl: "https://js-dos.com/6.22/current/wdosbox.wasm"
        }).ready(function (fs, main) {
            
            // Unzip the game file
            fs.extract("oregontrail.zip").then(function () {
                // Run the game
                main(["-c", "OREGON"]);
            });
            
        });
    </script>

</body>
</html>
